; Tells PlatformIO which board this program is for and how to build it.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Send Serial messages through the UART USB-C port. GPIO 19/20 (the native USB
; pins) are reserved for the IMU.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

; Driver for the BNO085 IMU.
lib_deps = adafruit/Adafruit BNO08x @ ^1.2.7
